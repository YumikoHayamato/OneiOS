# Phase 2: after a restart, register any app staged by `appinst install` now that xnuhost has injected its
# CDHashes and the signature validates. Runs once per boot. Needs launchd's bootstrap port (LaunchServices /
# installd XPC), so bootstrap=1. Runs as root (writes /var/containers, talks to lsd).
arg=/private/var/oneios/bin/appinst
arg=finalize
keepalive=0
bootstrap=1
