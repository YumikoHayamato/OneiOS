# The localhost install page: open http://127.0.0.1:8088/ in the guest's Safari, pick a decrypted .ipa from
# Files, tap Install. Kept running. Binds 127.0.0.1 only. Runs as root (it stages into /var/containers and calls
# the signer). To disable the web path and install only from a shell, remove enabled/appinst-serve.
arg=/private/var/oneios/bin/appinst
arg=serve
keepalive=1
throttle=5
bootstrap=1
