# oneios-init service: register OneiOS's app bundles with LaunchServices, once per boot (userland/apps/appreg).
# It copies each bundle into /private/var/staged_system_apps first (take22); env=ONEIOS_APPREG_STAGE=0 turns that off.
# take23: it also shows its own folder of the bundles over /Applications; env=ONEIOS_APPREG_VIEW=0 turns that off.
# take24: on the phone that mount is refused (the platform sandbox); the kernel mounts the folder at boot (hosted 0091,
# boot argument oneios-apps-view=0 turns it off) and this service keeps the folder's copies and logs what /Applications lists.
# bootstrap=1: it needs launchd's bootstrap port to reach lsd. Root, as the manager. Log: log/appreg.log.
arg=/private/var/ngpu/apps/oneios-appreg
keepalive=0
bootstrap=1
