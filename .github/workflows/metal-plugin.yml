# Build the Metal plug-in (userland/metal/build.sh, docs/building.md section 9) on a GitHub macOS runner with Xcode,
# for an owner who has no Linux iPhoneOS SDK (no Apple ID for the Xcode .xip).
#
# Apple's files never leave the runner: the SystemOS image is fetched from Apple's CDN into inputs/, the iOS 27 stubs
# are made from it into out/ios27-tbd, and both are deleted at the end. The only output is this project's own code,
# built: out/userland/NativeAdrenoMetal.{bundle,gpuaddon,build.json} and out/userland/helpers, packed and encrypted with the repository secret
# METAL_ARTIFACT_KEY (openssl AES-256-CBC, PBKDF2), kept one day. On the PC:
#   gh run download RUN -n metal-plugin -D DIR
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:KEYFILE -in DIR/metal-plugin.tar.zst.enc | zstd -d | tar -x
name: metal plug-in and helpers (macOS)
# workflow_dispatch needs the file on the default branch; a push to ci/metal-plugin runs it from any branch:
#   git push -f origin HEAD:ci/metal-plugin
# The plug-in carries OneiOS's patches (userland/metal/patches*, docs/gpu.md 7.1 and 7.2); the step "Metal plug-in" prints the
# ones taken. A push builds them all; "[metal-skip: NAME ...]" in the pushed commit's message, or the dispatch input skip,
# leaves some out (ONEIOS_METAL_SKIP of userland/metal/build.sh; the word screenrec leaves ScreenRecord.inc out).
# The stack (ONEIOS_METAL_STACK, docs/gpu.md 7.2): 555b13d unless the dispatch input stack, or "[metal-stack: 624bab3]" in the
# FIRST LINE of the pushed commit's message, asks for take18's (NativeMetal b0d6a07, metal2vulkan 624bab3), the fallback.
# (The first line only: run 46049251449 built the fallback because its commit's body explained this very tag.)
#   git push origin HEAD:ci/metal-upgrade      (the branch of the 555b13d stack; no force needed while it only grows)
on:
  push:
    branches: ['ci/metal-plugin', 'ci/metal-upgrade']
  workflow_dispatch:
    inputs:
      xcode:
        description: 'Xcode on the runner (the Mac build host of 2026-11-12 used 27.2)'
        default: '27.2'
      skip:
        description: 'OneiOS patches to leave out (ONEIOS_METAL_SKIP: names of userland/metal/patches*, blank-separated)'
        default: ''
      stack:
        description: 'The Metal stack (ONEIOS_METAL_STACK): 555b13d, or 624bab3 (take18, the fallback)'
        default: '555b13d'
permissions:
  contents: read
defaults:
  run:
    shell: bash  # -eo pipefail: a failure inside a pipe stops the step
jobs:
  metal:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode || '27.2' }}.app/Contents/Developer
      P: profiles/ios-27.0.1-iPhone18,2.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The key is set
        env:
          KEY: ${{ secrets.METAL_ARTIFACT_KEY }}
        run: '[ -n "$KEY" ] || { echo "no METAL_ARTIFACT_KEY secret: the output would not be encrypted" >&2; exit 1; }'
      - name: Tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install ninja glslang shaderc spirv-tools bison llvm rsync zstd uv
          uv pip install --system --break-system-packages --python "$(command -v python3)" meson mako pyyaml packaging
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
      - name: The Metal stack
        env:
          STACK_INPUT: ${{ inputs.stack || '' }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          # the dispatch input, else "[metal-stack: NAME]" in the first line of the pushed commit's message, else build.sh's default
          stack=$STACK_INPUT
          if [ -z "$stack" ]; then
            stack=$(printf '%s\n' "$HEAD_MESSAGE" | head -1 | sed -n 's/.*\[metal-stack: *\([0-9a-f]*\)\].*/\1/p')
          fi
          echo "ONEIOS_METAL_STACK=${stack:-555b13d}" >> "$GITHUB_ENV"
          echo "ONEIOS_METAL_STACK=${stack:-555b13d}"
      - name: Sources (pinned references, the kernel base)
        run: |
          scripts/setup/get-references.sh NativeAdreno NativeMobileDisplay AdrenoPM4 mesa-droidvm
          case "$ONEIOS_METAL_STACK" in
            624bab3) scripts/setup/get-references.sh NativeMetal metal2vulkan ;;
            *) scripts/setup/get-references.sh NativeMetal-935c468 metal2vulkan-555b13d Droid-VM-UniXNU-8789b8d ;;
          esac
          kernel/fetch.sh Droid-VM-UniXNU
      - name: SystemOS from Apple (only that member), the iOS 27 stubs
        run: |
          scripts/fetch/get-ipsw-cli.sh
          scripts/fetch/fetch.sh --only systemos "$P" 2>&1 | grep -v '%)'
          scripts/setup/ios-toolchain.sh --tbd --image inputs/24A446/043-70037-715.dmg
          scripts/setup/ios-toolchain.sh
      - name: Guest helpers (userland/helpers)
        run: |
          userland/helpers/build.sh
          cat out/userland/helpers/cdhashes.txt
      - name: Metal plug-in
        # "[helpers-only]" in the pushed commit's message skips it (about 30 minutes)
        if: ${{ !contains(github.event.head_commit.message, '[helpers-only]') }}
        env:
          SKIP_INPUT: ${{ inputs.skip || '' }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          export PATH="$(brew --prefix bison)/bin:$PATH"
          # ONEIOS_METAL_SKIP: the dispatch input, else "[metal-skip: NAME ...]" in the pushed commit's message
          ONEIOS_METAL_SKIP=$SKIP_INPUT
          if [ -z "$ONEIOS_METAL_SKIP" ]; then
            ONEIOS_METAL_SKIP=$(printf '%s\n' "$HEAD_MESSAGE" | sed -n 's/.*\[metal-skip: *\([^]]*\)\].*/\1/p' | head -1)
          fi
          export ONEIOS_METAL_SKIP
          echo "ONEIOS_METAL_SKIP=${ONEIOS_METAL_SKIP:-(none)}"
          userland/metal/build.sh
          ls -la out/userland
          python3 -c 'import json; r = json.load(open("out/userland/NativeAdrenoMetal.build.json")); print("stack:", r["stack"]); print("sources:", *[k + " " + v[:12] for k, v in r["sources"].items()], sep="\n  "); print("OneiOS patches taken:", *r["oneios_patches"], sep="\n  "); print("left out:", " ".join(r["oneios_metal_skip"]) or "none"); print("CDHashes:", *r["cdhashes"], sep="\n  ")'
      - name: The build's own logs (on a failure)
        if: failure()
        run: |
          for f in out/metal*/root/.cache/*.log out/metal*/root/build/*.log out/metal*/root/build/adreno-metal-bridge/*.log; do
            [ -f "$f" ] && { echo "::group::$f"; tail -60 "$f"; echo "::endgroup::"; }
          done
          true
      - name: Pack and encrypt (this project's code only)
        env:
          KEY: ${{ secrets.METAL_ARTIFACT_KEY }}
        run: |
          mkdir -p ship
          parts=(helpers)
          [ -d out/userland/NativeAdrenoMetal.bundle ] && parts+=(NativeAdrenoMetal.bundle NativeAdrenoMetal.gpuaddon NativeAdrenoMetal.build.json)
          tar -C out/userland -cf - "${parts[@]}" \
            | zstd -19 -q \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out ship/metal-plugin.tar.zst.enc
          shasum -a 256 ship/metal-plugin.tar.zst.enc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metal-plugin
          path: ship/metal-plugin.tar.zst.enc
          retention-days: 1
          if-no-files-found: error
      - name: Apple's files off the runner
        if: always()
        run: rm -rf inputs out/ios27-tbd out/ios27-cache out/image ship
